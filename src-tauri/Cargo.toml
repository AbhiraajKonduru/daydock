[package]
name = "daydock"
version = "0.1.0"
description = "A simple productivity system for turning weekly goals into focused daily action"
authors = ["Daydock"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "daydock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
walkdir = "2"
rusqlite = { version = "0.37", features = ["bundled-full"] }
