name: Release desktop apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: --bundles nsis
          - name: macOS universal
            platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Linux AppImage
            platform: ubuntu-22.04
            args: --bundles appimage

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build files
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Daydock ${{ github.ref_name }}
          releaseBody: |
            Daydock is in early development. This release may contain bugs, so keep a backup of your notebook.

            Downloads:
            - Windows: NSIS installer
            - macOS: universal DMG for Apple Silicon and Intel Macs
            - Linux, including Arch Linux: AppImage

            These builds are not code signed. Your operating system may show a security warning when you first open Daydock.
          releaseDraft: false
          prerelease: true
          generateReleaseNotes: true
          args: ${{ matrix.args }}
