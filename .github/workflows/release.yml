name: Release desktop apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: --bundles nsis
          - name: macOS universal
            platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Linux AppImage
            platform: ubuntu-22.04
            args: --bundles appimage

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build files
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Configure Apple code signing
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_CERTIFICATE_PASSWORD" || -z "$APPLE_ID" || -z "$APPLE_PASSWORD" || -z "$APPLE_TEAM_ID" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "::warning::Apple signing secrets are incomplete; publishing an unsigned macOS beta."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/daydock-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/daydock-signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::The imported certificate does not contain a Developer ID Application identity."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          rm -f "$CERTIFICATE_PATH"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Daydock ${{ github.ref_name }}
          releaseBody: |
            Daydock is in early development. This release may contain bugs, so keep a backup of your notebook.

            Downloads:
            - Windows: NSIS installer
            - macOS: universal DMG for Apple Silicon and Intel Macs
            - Linux, including Arch Linux: AppImage

            Updater packages are signed with Daydock's Tauri updater key. Platform code signing is applied when signing credentials are configured; otherwise beta installers may trigger an operating-system security warning.
          releaseDraft: false
          prerelease: true
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  publish-beta-channel:
    name: Publish beta update manifest
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download generated updater manifest
        run: |
          mkdir -p beta-manifest
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern latest.json --dir beta-manifest

      - name: Generate website download manifest
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json tagName,url,assets > beta-manifest/release.json
          jq -e --arg version "$(jq -r '.version' beta-manifest/latest.json)" '
            {
              version: ($version | sub("^v"; "")),
              releasePage: .url,
              downloads: {
                windows: ([.assets[] | select(.name | endswith("-setup.exe")) | .url][0]),
                macos: ([.assets[] | select(.name | endswith(".dmg")) | .url][0]),
                linux: ([.assets[] | select(.name | endswith(".AppImage")) | .url][0])
              }
            }
            | if ((.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+")) and ([.downloads[]] | all(. != null)))
              then .
              else error("The release version or a website download artifact is missing")
              end
          ' beta-manifest/release.json > beta-manifest/downloads.json

      - name: Create rolling beta channel if needed
        run: |
          if ! gh release view beta-channel --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create beta-channel \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Daydock beta update channel" \
              --notes "This rolling prerelease hosts manifests used by Daydock beta builds and the download website. Download installers from the numbered releases." \
              --prerelease
          fi

      - name: Publish beta channel manifests
        run: gh release upload beta-channel beta-manifest/latest.json beta-manifest/downloads.json --repo "${GITHUB_REPOSITORY}" --clobber
