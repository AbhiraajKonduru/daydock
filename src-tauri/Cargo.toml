[package]
name = "daydock"
version = "0.1.15"
description = "A quiet, local-first notebook for daily execution"
authors = ["Daydock"]
edition = "2021"

[lib]
name = "daydock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
walkdir = "2"
rusqlite = { version = "0.37", features = ["bundled-full"] }
